# Phase 0 gate: fmt, clippy -D warnings, tests, and migrations on a fresh Postgres.
# Actions are pinned by commit SHA. Changes under .github/ are a sensitive path (see CLAUDE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    # The first uncached run compiles DuckDB from source twice (check and test profiles), about
    # ten minutes each on a hosted runner; later runs restore it from the cache.
    timeout-minutes: 75
    # The store's integration tests create scratch databases on this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database: no password exists, so none is stored in the repo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  migrations:
    name: migrations apply to fresh Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database: no password exists, so none is stored in the repo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply migrations and run schema tests
        run: scripts/test-migrations.sh

  proposal:
    # A pull request that changes anything under research/ may change nothing else, at most
    # one config, and must respect the change budget (docs/phases/phase-7.md, "Proposal
    # check"). The checker is built from the BASE commit, never from the pull request: a
    # research pull request is untrusted input and must not supply its own judge.
    name: research proposal
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: List the changed paths
        id: changes
        run: |
          git -C head diff --name-status "$BASE_SHA...$HEAD_SHA" > changes.txt
          cat changes.txt
          # Every path on every line (a rename has two), one per line.
          if cut -f2- changes.txt | tr '\t' '\n' | grep -qE '^research(/|$)'; then
            echo "research=true" >> "$GITHUB_OUTPUT"
          else
            echo "research=false" >> "$GITHUB_OUTPUT"
            echo "No change under research/: nothing to check."
          fi

      - name: Is there a checker at the base?
        id: checker
        if: steps.changes.outputs.research == 'true'
        run: |
          # Only the pull request that introduces the checker has a base without one. It is a
          # build-phase change reviewed as code, not a research proposal.
          if [[ -f base/crates/eval/src/bin/nisse-proposal-check.rs ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base commit has no proposal checker; skipping (this is the change that adds it)."
          fi

      - name: Install pinned toolchain
        if: steps.checker.outputs.present == 'true'
        working-directory: base
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.checker.outputs.present == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            base/target
          key: proposal-${{ runner.os }}-${{ hashFiles('base/rust-toolchain.toml', 'base/Cargo.lock') }}
          restore-keys: |
            proposal-${{ runner.os }}-

      - name: Check the proposal
        if: steps.checker.outputs.present == 'true'
        working-directory: base
        run: |
          cargo build --locked -p nisse-eval --bin nisse-proposal-check
          target/debug/nisse-proposal-check --base . --head ../head < ../changes.txt
