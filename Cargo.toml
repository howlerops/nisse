[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/risk",
    "crates/alpaca-adapter",
    "crates/store",
    "crates/eval",
    "crates/bars",
    "crates/app",
    "crates/ui-data",
]
# The phone app has its own workspace (ui/ext/nisse-native): the main workspace and CI do not
# build a UI framework.
exclude = ["ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/howlerops/nisse"
publish = false

# Every version is pinned here, once. Crates reference these with `dep = { workspace = true }`.
[workspace.dependencies]
# Workspace crates
nisse-core = { path = "crates/core" }
nisse-engine = { path = "crates/engine" }
nisse-risk = { path = "crates/risk" }
nisse-store = { path = "crates/store" }
nisse-bars = { path = "crates/bars" }
nisse-app = { path = "crates/app" }
nisse-ui-data = { path = "crates/ui-data" }
nisse-alpaca-adapter = { path = "crates/alpaca-adapter" }

# NautilusTrader (LGPL-3.0-only). Exact pin, recorded in PLAN.md; all nautilus-* crates
# must share one version. Do not bump casually: the Rust API changes between releases.
nautilus-core = "=0.68.0"
nautilus-model = "=0.68.0"

chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# DuckDB is compiled from the source vendored in the crate (no download at build time).
duckdb = { version = "1.20001", default-features = false, features = ["bundled", "parquet", "rust_decimal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = { version = "1.43", features = ["db-tokio-postgres", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"

# Binaries only
anyhow = "1"

# Test-only
criterion = { version = "0.8", default-features = false }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
inefficient_to_string = "warn"
trivially_copy_pass_by_ref = "warn"

# DuckDB is compiled from source. With debug info its build directory is over 5 GB per
# feature combination, which fills a development disk and slows CI caching.
[profile.dev.package.libduckdb-sys]
debug = false
