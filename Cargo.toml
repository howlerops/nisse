[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/risk",
    "crates/alpaca-adapter",
    "crates/store",
    "crates/eval",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/howlerops/nisse"
publish = false

# Every version is pinned here, once. Crates reference these with `dep = { workspace = true }`.
[workspace.dependencies]
# Workspace crates
nisse-core = { path = "crates/core" }
nisse-engine = { path = "crates/engine" }

# NautilusTrader (LGPL-3.0-only). Exact pin, recorded in PLAN.md; all nautilus-* crates
# must share one version. Do not bump casually: the Rust API changes between releases.
nautilus-core = "=0.68.0"
nautilus-model = "=0.68.0"

chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust_decimal = "1.43"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Test-only
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
inefficient_to_string = "warn"
trivially_copy_pass_by_ref = "warn"
